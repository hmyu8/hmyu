<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stay Here</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }

    .text {
      position: absolute;
      bottom: 12%;
      width: 100%;
      text-align: center;
      font-size: 1rem;
      line-height: 1.6;
      letter-spacing: 0.04em;
      opacity: 0.85;
    }

    .support {
      position: absolute;
      bottom: 4%;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.6;
    }

    .support a {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.4);
      padding-bottom: 2px;
    }

    .support a:hover {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="container">
    <video autoplay muted loop playsinline>
      <source src="assets/video/hmyu1.mp4" type="video/mp4" />
    </video>

    <div class="text">
      Stay here.<br>
      Nothing else is required.
    </div>

    <div class="support">
      <a href="https://www.buymeacoffee.com/yourname" target="_blank">
        Support this place
      </a>
    </div>
  </div>
</body>
</html>
