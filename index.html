<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stay Here — A Quiet Place on the Internet</title>

  <meta name="description" content="A quiet place on the internet. Just stay here and breathe.">

  <meta property="og:title" content="Stay Here — A Quiet Place on the Internet">
  <meta property="og:description" content="A quiet place on the internet. Just stay here and breathe.">
  <meta property="og:type" content="website">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;

      transition: opacity 0.8s ease;
    }

    /* ⭐ 追加：ホワイトフラッシュ */
    #flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .text {
      position: absolute;
      bottom: 14%;
      width: 100%;
      text-align: center;
      font-size: 1rem;
      line-height: 1.6;
      letter-spacing: 0.04em;
      opacity: 0.85;
    }

    .switch {
      position: absolute;
      bottom: 8%;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.5;
      cursor: pointer;
      user-select: none;
    }

    .support {
      position: absolute;
      bottom: 4%;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.6;
    }

    .support a {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.4);
      padding-bottom: 2px;
    }

    .support a:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- ⭐ 追加：白フラッシュレイヤー -->
  <div id="flash"></div>

  <div class="container">

    <video id="bgVideo" autoplay muted loop playsinline>
      <source id="videoSource" src="" type="video/mp4" />
    </video>

    <div class="text">
      Stay here.<br>
      Nothing else is required.<br>
      This page exists for people who seek for a calm enviornment.
    </div>

    <div class="switch" id="switchArea">
      tap or press space
    </div>

    <div class="support">
      <a href="https://www.buymeacoffee.com/hmyu" target="_blank">
        If this place helped you in some way, you could support this place
      </a>
      <br>
      <a href="thoughts.html" style="opacity:0.6;">wonders & thoughts</a>
    </div>

  </div>

  <script>
    const videos = [
      "assets/video/hmyu1.mp4",
      "assets/video/hmyu2.mp4"
    ];

    let currentIndex = Math.floor(Math.random() * videos.length)

    const video = document.getElementById("bgVideo")
    const source = document.getElementById("videoSource")
    const switchArea = document.getElementById("switchArea")
    const flash = document.getElementById("flash") // ⭐追加

    function loadVideo(index){

      // ⭐ ホワイトアウト開始
      flash.style.opacity = 1

      setTimeout(() => {

        video.style.opacity = 0

        source.src = videos[index]
        video.load()
        video.play()

        video.style.opacity = 1

        // ⭐ ホワイトアウト解除
        flash.style.opacity = 0

      }, 400)

    }

    switchArea.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % videos.length
      loadVideo(currentIndex)
    })

    loadVideo(currentIndex)

    document.addEventListener("keydown", (event) => {

      if(event.code === "Space"){

        event.preventDefault()

        currentIndex = (currentIndex + 1) % videos.length

        loadVideo(currentIndex)

      }

    })
  </script>

</body>
</html>
